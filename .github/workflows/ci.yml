name: public-repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install release and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,release,test]"

      - name: Verify public boundary and paper release
        run: python tools/verify_public_repo.py

      - name: Run public contract tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
