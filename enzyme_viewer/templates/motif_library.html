<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="e2n-csp-nonce" content="{{ csp_nonce }}">
    <title>Motif Library</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}?v=journal-plate-20260709">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/e2n-theme.css') }}?v=journal-plate-20260709">
    <style>
        body { background: #f4f6f9; }
        #layout { display: flex; height: calc(100vh - 72px - 48px); margin-top: 72px; overflow: hidden; }

        /* Left column */
        #leftCol {
            width: 240px; min-width: 200px; max-width: 300px;
            background: #fff; border-right: 1px solid #dee2e6;
            display: flex; flex-direction: column; overflow: hidden;
        }
        #leftCol .col-header {
            padding: 14px 16px 10px; font-weight: 600; font-size: 13px;
            color: #495057; border-bottom: 1px solid #dee2e6; background: #f8f9fa;
            text-transform: uppercase; letter-spacing: .5px;
        }
        #typeList { overflow-y: auto; flex: 1; padding: 8px 0; }
        .type-item {
            padding: 10px 16px; cursor: pointer; font-size: 14px;
            border-left: 3px solid transparent; transition: all .15s;
            display: flex; align-items: center; gap: 8px;
        }
        .type-item:hover { background: #f0f4ff; border-left-color: #6c8ebf; }
        .type-item.active { background: #e8f0fe; border-left-color: #1a73e8; color: #1a73e8; font-weight: 600; }
        .type-badge { margin-left: auto; font-size: 11px; background: #e9ecef; color: #6c757d; padding: 1px 7px; border-radius: 10px; }
        .type-item.active .type-badge { background: #c2d7fb; color: #1a73e8; }

        /* Right column */
        #rightCol { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #rightPlaceholder {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #adb5bd; flex-direction: column; gap: 12px;
        }
        #rightPlaceholder i { font-size: 48px; }

        /* Tab bar */
        #tabBar {
            display: none; border-bottom: 1px solid #dee2e6;
            background: #fff; padding: 0 20px;
        }
        .tab-btn {
            padding: 12px 20px; border: none; background: none; cursor: pointer;
            font-size: 14px; font-weight: 500; color: #6c757d;
            border-bottom: 3px solid transparent; margin-bottom: -1px;
            transition: all .15s;
        }
        .tab-btn:hover { color: #1a73e8; }
        .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .tab-btn i { margin-right: 6px; }

        /* Tab content */
        #tabContent { flex: 1; overflow-y: auto; padding: 20px; }

        /* Metal sites */
        .metal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .metal-card {
            background: #fff; border-radius: 8px; border: 1px solid #dee2e6;
            padding: 16px; transition: box-shadow .15s;
        }
        .metal-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .metal-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .metal-symbol {
            width: 44px; height: 44px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: #fff;
        }
        .metal-title { flex: 1; }
        .metal-title strong { font-size: 15px; display: block; }
        .metal-title small { color: #6c757d; font-size: 12px; }
        .role-badge {
            font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
        }
        .role-catalytic { background: #fde8e8; color: #c0392b; }
        .role-structural { background: #e8f4fd; color: #2980b9; }
        .role-substrate_binding { background: #e8fdf0; color: #27ae60; }
        .role-unknown { background: #f0f0f0; color: #7f8c8d; }
        .coord-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 8px; }
        .coord-table th { background: #f8f9fa; padding: 4px 8px; text-align: left; font-weight: 600; color: #495057; border-bottom: 1px solid #dee2e6; }
        .coord-table td { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; }
        .coord-table tr:last-child td { border-bottom: none; }
        .metal-meta { font-size: 12px; color: #6c757d; margin-top: 8px; }
        .metal-meta span { margin-right: 12px; }

        /* Active sites */
        .active-sites-list { display: flex; flex-direction: column; gap: 12px; }
        .anchor-card {
            background: #fff; border-radius: 8px; border: 1px solid #dee2e6;
            padding: 14px 16px;
        }
        .anchor-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .residue-chip {
            background: #e8f0fe; color: #1a73e8; font-weight: 700;
            padding: 4px 10px; border-radius: 6px; font-size: 13px; font-family: monospace;
        }
        .role-tag {
            font-size: 12px; padding: 3px 10px; border-radius: 12px;
            background: #fff3cd; color: #856404; font-weight: 500;
        }
        .anchor-detail { font-size: 12px; color: #6c757d; }
        .anchor-detail span { margin-right: 14px; }

        /* Loading / empty */
        .loading-box { text-align: center; padding: 40px; color: #6c757d; }
        .empty-box { text-align: center; padding: 40px; color: #adb5bd; }
        .empty-box i { font-size: 36px; margin-bottom: 10px; display: block; }

        /* Section header */
        .section-header { font-size: 13px; font-weight: 600; color: #6c757d; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }

        .navbar { background: var(--e2n-charcoal) !important; }
        .footer { text-align: center; padding: 12px; font-size: 12px; color: #6b7280; background: rgba(255,255,255,.85); border-top: 1px solid var(--e2n-line); }
    </style>
</head>
<body class="e2n-app">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-shadow">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="/">E2N Structure Browser</a>
            <a class="btn btn-sm btn-outline-light ml-auto mr-2" href="/nanozyme_design">Rational Design</a>
            <a class="btn btn-sm btn-outline-light" href="/motif_library">Motif Library</a>
        </div>
    </nav>

    <div id="layout">
        <!-- Left: nanozyme type list -->
        <div id="leftCol">
            <div class="col-header"><i class="fas fa-flask"></i> Nanozyme Types</div>
            <div id="typeList">
                <div class="loading-box"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
        </div>

        <!-- Right: detail area -->
        <div id="rightCol">
            <div id="rightPlaceholder">
                <i class="fas fa-atom"></i>
                <span>Select a nanozyme type to explore its sites</span>
            </div>

            <div id="tabBar">
                <button class="tab-btn active" id="tabMetalBtn" type="button">
                    <i class="fas fa-atom"></i> Metal Sites <span id="metalCount" class="badge badge-secondary ml-1">0</span>
                </button>
                <button class="tab-btn" id="tabActiveBtn" type="button">
                    <i class="fas fa-flask"></i> Active Sites <span id="activeCount" class="badge badge-secondary ml-1">0</span>
                </button>
            </div>

            <div id="tabContent" style="display:none;">
                <div id="metalPanel"></div>
                <div id="activePanel" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="footer">&copy; 2024 Enzyme Structure Viewer. All rights reserved.</div>

    <script src="{{ url_for('static', filename='js/jquery-3.3.1.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/popper-1.14.7.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/e2n-common.js') }}?v=journal-plate-20260709"></script>
    <script src="{{ url_for('static', filename='js/motif_library.js') }}?v=journal-plate-20260709"></script>
</body>
</html>
