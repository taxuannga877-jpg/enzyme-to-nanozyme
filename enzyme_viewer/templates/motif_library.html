<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motif库浏览器 - Motif Library Browser</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .motif-category {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        .motif-category h4 {
            color: #007bff;
            margin-bottom: 15px;
        }
        .motif-item {
            padding: 10px;
            margin: 5px 0;
            background-color: white;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            cursor: pointer;
            transition: all 0.3s;
        }
        .motif-item:hover {
            background-color: #e7f3ff;
            border-color: #007bff;
            transform: translateX(5px);
        }
        .motif-item.active {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }
        .motif-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .motif-id {
            font-weight: bold;
        }
        .motif-stats {
            font-size: 0.9em;
            color: #6c757d;
        }
        .motif-item.active .motif-stats {
            color: #e0e0e0;
        }
        .structure-viewer-container {
            min-height: 500px;
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }
        .motif-details {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
        }
        .back-btn {
            margin-bottom: 20px;
        }
        .role-category {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            border-left: 3px solid #28a745;
        }
        .role-category h6 {
            color: #28a745;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .residue-item {
            padding: 8px;
            margin: 5px 0;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            cursor: pointer;
            transition: all 0.2s;
        }
        .residue-item:hover {
            background-color: #e7f3ff;
            border-color: #007bff;
        }
        .residue-item.active {
            background-color: #007bff;
            color: white;
        }
        .residue-structure-viewer {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-shadow">
        <div class="container">
            <a class="navbar-brand" href="/">Enzyme Structure Viewer</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div id="content">
        <div class="container-fluid" style="padding: 20px;">
            <button class="btn btn-secondary back-btn" onclick="window.location.href='/'">
                <i class="fas fa-arrow-left"></i> 返回第一页
            </button>
            
            <div id="outerContainer">
                <!-- 左侧：纳米酶类型和Motif分类列表 -->
                <div id="leftColumn">
                    <div class="control-panel">
                        <h3><i class="fas fa-list"></i> 可用纳米酶类型列表</h3>
                        <div id="loadingNanozymeIndicator" class="loading-indicator">
                            <i class="fas fa-spinner fa-spin"></i> 正在加载纳米酶类型列表...
                        </div>
                        <div id="nanozymeList" class="ec-list">
                            <!-- 纳米酶类型列表将在这里动态生成 -->
                        </div>
                    </div>

                    <div class="pdb-list-panel" id="motifListPanel" style="display: none;">
                        <h4><i class="fas fa-puzzle-piece"></i> Motif分类 (<span id="motifCount">0</span>)</h4>
                        <div id="loadingMotifIndicator" class="loading-indicator" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> 正在加载Motif列表...
                        </div>
                        <div id="motifCategories" class="motif-categories">
                            <!-- Motif分类列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 右侧：Motif结构展示和详细信息 -->
                <div id="rightColumn">
                    <div id="motifInfo" class="structure-info">
                        <div class="placeholder-text">
                            <i class="fas fa-puzzle-piece fa-3x"></i>
                            <p>请从左侧选择纳米酶类型和Motif查看结构</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2024 Enzyme Structure Viewer. All rights reserved.
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
    
    <script>
        let currentNanozymeType = null;
        let currentMotif = null;

        // 页面加载时获取纳米酶类型列表
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面DOM加载完成，准备加载纳米酶类型列表');
            loadNanozymeTypes();
        });
        
        // 如果DOM已经加载完成，立即执行
        if (document.readyState === 'loading') {
            console.log('DOM正在加载，等待DOMContentLoaded事件');
        } else {
            console.log('DOM已经加载完成，立即执行loadNanozymeTypes');
            loadNanozymeTypes();
        }

        // 加载纳米酶类型列表
        function loadNanozymeTypes() {
            console.log('开始加载纳米酶类型列表...');
            const loadingIndicator = document.getElementById('loadingNanozymeIndicator');
            const nanozymeList = document.getElementById('nanozymeList');
            
            if (!loadingIndicator) {
                console.error('找不到 loadingNanozymeIndicator 元素');
                return;
            }
            if (!nanozymeList) {
                console.error('找不到 nanozymeList 元素');
                return;
            }
            
            loadingIndicator.style.display = 'block';
            nanozymeList.innerHTML = '';
            console.log('发送API请求到 /api/list_nanozyme_types');

            fetch('/api/list_nanozyme_types', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                console.log('收到响应，状态码:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('API Response:', data);
                loadingIndicator.style.display = 'none';
                
                // 检查是否有错误状态
                if (data.status === 'error' || data.error) {
                    console.error('API返回错误:', data.error || '未知错误');
                    nanozymeList.innerHTML = '<div class="error-text">加载失败: ' + (data.error || '未知错误') + '</div>';
                    return;
                }

                // 检查是否有纳米酶类型数据
                if (data.nanozyme_types && Array.isArray(data.nanozyme_types) && data.nanozyme_types.length > 0) {
                    console.log('找到', data.nanozyme_types.length, '种纳米酶类型:', data.nanozyme_types);
                    displayNanozymeTypes(data.nanozyme_types);
                } else {
                    console.warn('未找到可用的纳米酶类型，响应数据:', data);
                    nanozymeList.innerHTML = '<div class="error-text">未找到可用的纳米酶类型</div>';
                }
            })
            .catch(error => {
                loadingIndicator.style.display = 'none';
                console.error('Error loading nanozyme types:', error);
                nanozymeList.innerHTML = '<div class="error-text">加载失败: ' + error.message + '</div>';
            });
        }

        // 显示纳米酶类型列表
        function displayNanozymeTypes(nanozymeTypes) {
            console.log('开始显示纳米酶类型列表，数量:', nanozymeTypes.length);
            const nanozymeListDiv = document.getElementById('nanozymeList');
            if (!nanozymeListDiv) {
                console.error('找不到 nanozymeList 元素，无法显示列表');
                return;
            }
            nanozymeListDiv.innerHTML = '';

            nanozymeTypes.forEach((nanozymeType, index) => {
                console.log(`添加纳米酶类型 ${index + 1}/${nanozymeTypes.length}: ${nanozymeType}`);
                const typeItem = document.createElement('div');
                typeItem.className = 'ec-item';
                typeItem.innerHTML = `
                    <button class="btn btn-outline-primary btn-block ec-btn" 
                            data-nanozyme-type="${nanozymeType}">
                        <i class="fas fa-flask"></i> ${nanozymeType}
                    </button>
                `;
                
                // 添加点击事件
                const typeBtn = typeItem.querySelector('.ec-btn');
                typeBtn.addEventListener('click', function() {
                    // 移除其他按钮的active状态
                    document.querySelectorAll('.ec-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    // 添加当前按钮的active状态
                    this.classList.add('active');
                    loadMotifsForNanozymeType(nanozymeType);
                });
                
                nanozymeListDiv.appendChild(typeItem);
            });
            console.log('完成显示纳米酶类型列表，共添加', nanozymeTypes.length, '个元素');
            console.log('nanozymeListDiv的子元素数量:', nanozymeListDiv.children.length);
        }

        // 加载指定纳米酶类型的Motif列表
        function loadMotifsForNanozymeType(nanozymeType) {
            currentNanozymeType = nanozymeType;
            const loadingIndicator = document.getElementById('loadingMotifIndicator');
            const motifListPanel = document.getElementById('motifListPanel');
            const motifCategories = document.getElementById('motifCategories');
            
            loadingIndicator.style.display = 'block';
            motifListPanel.style.display = 'block';
            motifCategories.innerHTML = '';

            fetch('/api/list_motifs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nanozyme_type: nanozymeType
                })
            })
            .then(response => response.json())
            .then(data => {
                loadingIndicator.style.display = 'none';
                
                if (data.error) {
                    motifCategories.innerHTML = '<div class="error-text">加载失败: ' + data.error + '</div>';
                    return;
                }

                if (data.motifs && Object.keys(data.motifs).length > 0) {
                    displayMotifCategories(data.motifs, data.total_count);
                } else {
                    motifCategories.innerHTML = '<div class="error-text">该纳米酶类型暂无Motif数据</div>';
                }
            })
            .catch(error => {
                loadingIndicator.style.display = 'none';
                console.error('Error:', error);
                motifCategories.innerHTML = '<div class="error-text">加载失败: ' + error + '</div>';
            });
        }

        // 显示Motif分类
        function displayMotifCategories(motifsByCategory, totalCount) {
            const motifCategories = document.getElementById('motifCategories');
            const motifCount = document.getElementById('motifCount');
            motifCount.textContent = totalCount;
            
            motifCategories.innerHTML = '';

            // 定义分类顺序和显示名称
            const categoryOrder = ['metal_sites', 'catalytic_sites', 'binding_sites', 'ligands_cofactors', 'other'];
            const categoryNames = {
                'metal_sites': '金属位点 (Metal Sites)',
                'catalytic_sites': '催化活性位点 (Catalytic Active Sites)',
                'binding_sites': '结合位点 (Binding Sites)',
                'ligands_cofactors': '配体或辅因子 (Ligands/Cofactors)',
                'other': '其他 (Other)'
            };

            categoryOrder.forEach(category => {
                if (motifsByCategory[category] && motifsByCategory[category].length > 0) {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'motif-category';
                    categoryDiv.innerHTML = `<h4>${categoryNames[category]} (${motifsByCategory[category].length})</h4>`;
                    
                    const motifList = document.createElement('div');
                    motifList.className = 'motif-list';
                    
                    motifsByCategory[category].forEach(motif => {
                        const motifItem = document.createElement('div');
                        motifItem.className = 'motif-item';
                        
                        // 检查是否为M-CSA来源或配体/辅因子
                        const isMcsa = motif.source === 'M-CSA' || (motif.motif_id && motif.motif_id.toLowerCase().includes('_mcsa_'));
                        const isLigand = category === 'ligands_cofactors';
                        const isMetalSite = category === 'metal_sites';
                        
                        // 构建显示名称 - 金属位点和配体使用相同的显示方式
                        let displayName = 'Unknown';
                        if (isMetalSite || isLigand) {
                            // 金属位点和配体：使用ligand_name或ligand_id
                            displayName = motif.ligand_name || motif.ligand_id || motif.metal_name || motif.motif_id || 'Unknown';
                            // 金属位点和配体都显示出现次数（如果有）
                            if ((isMetalSite || isLigand) && motif.occurrence_count && motif.occurrence_count > 1) {
                                displayName += ` (${motif.occurrence_count}次出现)`;
                            }
                        } else {
                            displayName = motif.motif_id || 'Unknown';
                        }
                        if (isMcsa) {
                            displayName += ' <span style="color: #856404; font-size: 0.9em;">（来自M-CSA）</span>';
                        }
                        
                        // 构建统计信息 - 金属位点和配体使用相同的显示方式
                        let statsHtml = '';
                        if (isLigand) {
                            statsHtml = `${motif.atom_count || 0} 个原子 | ${motif.pdb_id || 'N/A'} | ${motif.uniprot_id || 'N/A'}`;
                        } else if (isMetalSite) {
                            // 金属位点：显示原子数、PDB ID列表（多个用逗号分隔）和UniProt ID
                            const pdbIds = motif.pdb_ids && motif.pdb_ids.length > 0 
                                ? (motif.pdb_ids.length <= 3 
                                    ? motif.pdb_ids.join(', ') 
                                    : `${motif.pdb_ids.slice(0, 3).join(', ')}... (共${motif.pdb_ids.length}个)`)
                                : 'N/A';
                            statsHtml = `${motif.atom_count || 0} 个原子 | ${pdbIds} | ${motif.uniprot_id || 'N/A'}`;
                        } else {
                            statsHtml = `${motif.anchor_atoms_count || 0} 个锚点原子 | ${motif.uniprot_id || 'N/A'}`;
                        }
                        
                        motifItem.innerHTML = `
                            <div class="motif-info">
                                <div>
                                    <div class="motif-id">${displayName}</div>
                                    <div class="motif-stats">
                                        ${statsHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        motifItem.addEventListener('click', function() {
                            // 移除其他项的active状态
                            document.querySelectorAll('.motif-item').forEach(item => {
                                item.classList.remove('active');
                            });
                            // 添加当前项的active状态
                            this.classList.add('active');
                            
                            if (isLigand) {
                                loadLigandStructure(motif);
                            } else {
                                loadMotifStructure(motif);
                            }
                        });
                        
                        motifList.appendChild(motifItem);
                    });
                    
                    categoryDiv.appendChild(motifList);
                    motifCategories.appendChild(categoryDiv);
                }
            });
        }

        // 加载配体结构
        function loadLigandStructure(ligand) {
            const motifInfo = document.getElementById('motifInfo');
            motifInfo.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-spin"></i> 正在加载配体结构...</div>';

            fetch('/api/get_ligand_structure', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ligand_id: ligand.ligand_id,
                    pdb_path: ligand.file_path,
                    ligand_name: ligand.ligand_name,
                    chain: ligand.chain,
                    residue_number: ligand.residue_number
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    displayLigandStructure(data, ligand);
                } else {
                    motifInfo.innerHTML = `<div class="error-text">加载失败: ${data.error}</div>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                motifInfo.innerHTML = `<div class="error-text">加载失败: ${error}</div>`;
            });
        }

        // 显示配体结构
        function displayLigandStructure(data, ligand) {
            const motifInfo = document.getElementById('motifInfo');
            const pdbString = data.pdb_string || '';
            
            let html = `
                <div class="structure-info">
                    <div class="structure-header" style="margin-bottom: 20px;">
                        <h3>
                            <i class="fas fa-atom"></i> 配体: ${ligand.ligand_name}
                        </h3>
                        <div style="margin-top: 10px;">
                            <span class="badge badge-primary">EC: ${ligand.ec_number}</span>
                            <span class="badge badge-info">PDB: ${ligand.pdb_id}</span>
                            <span class="badge badge-success">UniProt: ${ligand.uniprot_id}</span>
                            <span class="badge badge-secondary">原子数: ${data.atom_count}</span>
                        </div>
                    </div>
                    
                    <div class="structure-viewer-container">
                        <h5><i class="fas fa-cube"></i> 3D结构视图</h5>
                        <div id="ligandViewer" style="width: 100%; height: 500px; position: relative; border: 1px solid #ddd; border-radius: 5px;"></div>
                    </div>
                </div>
            `;
            
            motifInfo.innerHTML = html;
            
            // 等待DOM更新后初始化3Dmol
            setTimeout(() => {
                const viewerDiv = document.getElementById('ligandViewer');
                if (!viewerDiv) {
                    console.error('Ligand viewer div not found');
                    return;
                }
                
                try {
                    const viewer = $3Dmol.createViewer(viewerDiv, {
                        defaultcolors: $3Dmol.rasmolElementColors
                    });
                    
                    if (pdbString && pdbString.trim().length > 0) {
                        viewer.addModel(pdbString, "pdb");
                        
                        // 设置stick模式，使用元素颜色
                        viewer.setStyle({}, {
                            stick: {
                                radius: 0.2,
                                colorscheme: $3Dmol.rasmolElementColors
                            },
                            sphere: {
                                radius: 0.6,
                                colorscheme: $3Dmol.rasmolElementColors
                            }
                        });
                        
                        viewer.zoomTo();
                        viewer.render();
                    } else {
                        viewerDiv.innerHTML = '<div class="error-text" style="text-align: center; padding: 50px; color: red;">无法渲染配体结构：PDB数据为空</div>';
                    }
                } catch (error) {
                    console.error('Error rendering ligand structure:', error);
                    viewerDiv.innerHTML = '<div class="error-text" style="text-align: center; padding: 50px; color: red;">无法渲染配体结构：' + error.message + '</div>';
                }
            }, 100);
        }

        // 加载Motif结构
        function loadMotifStructure(motif) {
            currentMotif = motif;
            const motifInfo = document.getElementById('motifInfo');
            motifInfo.innerHTML = '<div class="loading-text"><i class="fas fa-spinner fa-spin"></i> 正在加载Motif结构...</div>';

            fetch('/api/get_motif_structure', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    motif_id: motif.motif_id,
                    nanozyme_type: currentNanozymeType,
                    file_paths: motif.file_paths || [],
                    ligand_name: motif.ligand_name || motif.metal_name || null,
                    metal_type: motif.metal_type || null,
                    chain: motif.chain || null,
                    residue_number: motif.residue_number || null
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Motif structure response:', data);
                if (data.status === 'success') {
                    console.log('PDB string length:', data.pdb_string ? data.pdb_string.length : 0);
                    displayMotifStructure(data);
                } else {
                    console.error('Error loading motif structure:', data.error);
                    motifInfo.innerHTML = `<div class="error-text">加载失败: ${data.error}</div>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                motifInfo.innerHTML = `<div class="error-text">加载失败: ${error}</div>`;
            });
        }

        // 显示Motif结构
        function displayMotifStructure(data) {
            const motifInfo = document.getElementById('motifInfo');
            const motif = data.motif;
            const pdbString = data.pdb_string || '';  // 保存PDB字符串供后续使用
            const residueStructures = motif.residue_structures || {};  // 保存残基结构数据
            
            // 保存到全局变量供其他函数使用
            window.currentMotifData = {
                motif: motif,
                pdbString: pdbString,
                residueStructures: residueStructures,
                anchorAtoms: motif.anchor_atoms || []
            };
            
            // 按角色分组锚点原子
            const atomsByRole = {};
            (motif.anchor_atoms || []).forEach(atom => {
                const role = atom.role || '未分类';
                if (!atomsByRole[role]) {
                    atomsByRole[role] = [];
                }
                atomsByRole[role].push(atom);
            });
            
            // 显示颜色图例和功能原子信息
            displayColorLegend();
            displayFunctionalAtoms(motif.anchor_atoms || []);
            
            let html = `
                <div class="structure-info">
                    <div class="structure-header" style="margin-bottom: 20px;">
                        <h3>
                            <i class="fas fa-puzzle-piece"></i> Motif: ${motif.motif_id}
                        </h3>
                        <div style="margin-top: 10px;">
                            <span class="badge badge-primary">EC: ${motif.ec_number}</span>
                            <span class="badge badge-info">UniProt: ${motif.uniprot_id}</span>
                            <span class="badge badge-success">类型: ${motif.nanozyme_type}</span>
                        </div>
                    </div>
                    
                    <div class="structure-viewer-container">
                        <div class="row">
                            <div class="col-md-8">
                                <h5><i class="fas fa-cube"></i> 3D结构视图</h5>
                                <div id="motifViewer" style="width: 100%; height: 500px; position: relative; border: 1px solid #ddd; border-radius: 5px;"></div>
                            </div>
                            <div class="col-md-4">
                                <div id="structureInfoPanel" style="padding: 15px; background-color: #f8f9fa; border-radius: 5px; height: 500px; overflow-y: auto;">
                                    <h5><i class="fas fa-info-circle"></i> 结构信息</h5>
                                    <div id="colorLegend" style="margin-top: 15px;">
                                        <h6><i class="fas fa-palette"></i> 颜色图例</h6>
                                        <div id="colorLegendContent"></div>
                                </div>

                    console.error('Error rendering residue structure:', error);
                    console.error('Error stack:', error.stack);
                    viewerDiv.innerHTML = '<div class="error-text" style="text-align: center; padding: 50px; color: red;">无法渲染残基结构：' + error.message + '</div>';
                }
            }, 100);
        }

        // 生成单残基PDB字符串
        function generateResiduePDB(residue, residueName, residueNumber, chainId) {
            let pdbLines = [];
            let atomSerial = 1;
            
            // 添加HEADER行（可选，3Dmol可以没有）
            // pdbLines.push('HEADER    RESIDUE STRUCTURE');
            
            // 添加ATOM记录
            residue.atoms.forEach(atom => {
                // 确保原子名称格式正确（PDB格式要求）
                let atomName = (atom.atom_name || '').trim();
                // 如果原子名称长度超过4，截断
                if (atomName.length > 4) {
                    atomName = atomName.substring(0, 4);
                }
                // 如果原子名称是1-2个字符，需要右对齐；如果是3-4个字符，左对齐
                if (atomName.length <= 2) {
                    atomName = atomName.padStart(2);
                }
                atomName = atomName.padEnd(4);
                
                // 残基名称（3个字符）
                const resName = (residueName || 'UNK').substring(0, 3).padEnd(3);
                
                // 链ID（1个字符）
                const chain = (chainId || 'A').substring(0, 1);
                
                // 残基编号（4位数字，右对齐）
                const resNum = String(residueNumber || 0).padStart(4);
                
                // 原子序号（5位数字，右对齐）
                const serial = String(atomSerial).padStart(5);
                
                // 坐标（8位，包含小数点）
                let x = '0.000';
                let y = '0.000';
                let z = '0.000';
                
                if (atom.coordinates && Array.isArray(atom.coordinates)) {
                    x = parseFloat(atom.coordinates[0] || 0).toFixed(3);
                    y = parseFloat(atom.coordinates[1] || 0).toFixed(3);
                    z = parseFloat(atom.coordinates[2] || 0).toFixed(3);
                } else if (atom.coordinates && typeof atom.coordinates === 'object') {
                    x = parseFloat(atom.coordinates.x || atom.coordinates[0] || 0).toFixed(3);
                    y = parseFloat(atom.coordinates.y || atom.coordinates[1] || 0).toFixed(3);
                    z = parseFloat(atom.coordinates.z || atom.coordinates[2] || 0).toFixed(3);
                }
                
                x = x.padStart(8);
                y = y.padStart(8);
                z = z.padStart(8);
                
                // 占据率（6位，包含小数点）
                const occupancy = (atom.occupancy !== undefined ? parseFloat(atom.occupancy).toFixed(2) : '1.00').padStart(6);
                
                // 温度因子（6位，包含小数点）
                const tempFactor = (atom.bfactor !== undefined || atom.tempFactor !== undefined 
                    ? parseFloat(atom.bfactor || atom.tempFactor || 0).toFixed(2) 
                    : '0.00').padStart(6);
                
                // 元素符号（从原子名称或element字段获取）
                let element = '';
                if (atom.element) {
                    element = String(atom.element).trim().substring(0, 2);
                } else if (atomName.trim().length > 0) {
                    // 从原子名称推断元素（通常是第一个字符）
                    element = atomName.trim()[0];
                } else {
                    element = 'C'; // 默认碳
                }
                element = element.padStart(2);
                
                // 构建ATOM记录行（标准PDB格式）
                // 格式: ATOM  serial name resName chain resNum    x    y    z occupancy tempFactor          element
                // 位置:  1-6   7-11  13-16 18-20   22    23-26  31-38 39-46 47-54 55-60    61-66             77-78
                const atomLine = `ATOM  ${serial} ${atomName} ${resName} ${chain}${resNum}    ${x}${y}${z}${occupancy}${tempFactor}          ${element}`;
                pdbLines.push(atomLine);
                
                atomSerial++;
            });
            
            // 添加END行
            pdbLines.push('END');
            
            return pdbLines.join('\n');
        }
            
            // 辅助函数：使用球体显示（回退方案）
            function renderAsSpheres(viewer, atoms, motif) {
                atoms.forEach((atom, index) => {
                    viewer.addSphere({
                        center: {
                            x: atom.coordinates[0],
                            y: atom.coordinates[1],
                            z: atom.coordinates[2]
                        },
                        radius: 1.0,
                        color: getElementColor(atom.element)
                    });
                    
                    // 添加标签
                    viewer.addLabel(
                        `${atom.residue_name}${atom.residue_number}:${atom.atom_name}`,
                        {
                            position: {
                                x: atom.coordinates[0],
                                y: atom.coordinates[1],
                                z: atom.coordinates[2]
                            },
                            backgroundColor: 'white',
                            backgroundOpacity: 0.8,
                            font: 'Arial',
                            fontSize: 12
                        }
                    );
                });
                
                // 添加连接线（基于距离约束）
                motif.geometry_constraints.forEach(constraint => {
                    if (constraint.constraint_type === 'distance' && constraint.atom_indices.length === 2) {
                        const i1 = constraint.atom_indices[0];
                        const i2 = constraint.atom_indices[1];
                        if (i1 < atoms.length && i2 < atoms.length) {
                            const atom1 = atoms[i1];
                            const atom2 = atoms[i2];
                            viewer.addLine({
                                start: {
                                    x: atom1.coordinates[0],
                                    y: atom1.coordinates[1],
                                    z: atom1.coordinates[2]
                                },
                                end: {
                                    x: atom2.coordinates[0],
                                    y: atom2.coordinates[1],
                                    z: atom2.coordinates[2]
                                },
                                color: 'gray',
                                radius: 0.1
                            });
                        }
                    }
                });
                
                viewer.zoomTo();
                viewer.render();
        }

        // 获取元素颜色
        function getElementColor(element) {
            const colors = {
                'C': 'gray',
                'N': 'blue',
                'O': 'red',
                'S': 'yellow',
                'P': 'orange',
                'FE': 'brown',
                'CU': 'brown',
                'ZN': 'gray',
                'MG': 'green',
                'CA': 'gray',
                'MN': 'purple'
            };
            return colors[element.toUpperCase()] || 'gray';
        }
    </script>
